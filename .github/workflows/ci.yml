name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The database tests use compose.yaml's PostgreSQL, so its version is written in one place.
      - name: Start PostgreSQL
        run: docker compose up -d --wait postgres

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      # Before the commit checks, which need Biome to check TypeScript formatting.
      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version-file: .golangci-lint-version
          install-only: true

      - name: Read the sqlc version
        id: sqlc
        run: echo "version=$(cat .sqlc-version)" >> "$GITHUB_OUTPUT"

      - name: Install sqlc
        uses: sqlc-dev/setup-sqlc@bac53b7fb28c039a6c7f5736fd1e89744021bdd6 # v5.0.0
        with:
          sqlc-version: ${{ steps.sqlc.outputs.version }}

      # uv at the version services/stt's pyproject.toml requires; it installs the Python in
      # .python-version. Before the commit checks, which need Ruff to check Python formatting.
      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version-file: services/stt/pyproject.toml
          cache-dependency-glob: services/stt/uv.lock

      # The same checks as the git hooks, so they hold even when a hook was skipped.
      - name: Commit checks (no ignored files, formatting)
        run: .githooks/pre-commit

      - name: Docs check (links, labels, decision index)
        run: python3 scripts/lib/check_docs.py

      - name: Lint (static checks, module boundaries)
        run: golangci-lint run ./...

      - name: Dead code
        run: scripts/lib/deadcode.sh

      - name: Generated code is current (sqlc)
        run: scripts/sqlc.sh diff

      # CI is set by GitHub, so a missing database fails these tests instead of skipping them.
      - name: Tests with the race detector and the database
        env:
          TEST_DATABASE_URL: postgres://voice:voice@127.0.0.1:5432/postgres?sslmode=disable
        run: go test -race ./...

      - name: TypeScript checks (Biome, types, tests)
        run: scripts/lib/check-ts.sh

      - name: Python checks (Ruff, tests)
        run: scripts/lib/check-py.sh
