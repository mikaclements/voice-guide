<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>voice-guide</title>
    <style>
      body { font: 16px/1.5 system-ui, sans-serif; max-width: 44rem; margin: 2rem auto; padding: 0 1rem; color: #222; }
      .row { display: flex; gap: 0.5rem; margin: 1rem 0; }
      .row > input, .row > select { flex: 1; font: inherit; padding: 0.4rem; }
      button { font: inherit; padding: 0.4rem 1rem; }
      .error { background: #fde8e8; border: 1px solid #e0a0a0; padding: 0.5rem 0.75rem; white-space: pre-wrap; }
      .turn { margin: 0.75rem 0; white-space: pre-wrap; }
      .who { font-weight: 600; margin-right: 0.5rem; }
      .meta { color: #777; font-size: 0.85rem; }
      header { display: flex; align-items: baseline; gap: 2rem; border-bottom: 1px solid #ddd; margin-bottom: 1.5rem; }
      header h1 { font-size: 1.25rem; margin: 0; }
      .tabs { display: flex; gap: 0.25rem; }
      .tabs a { padding: 0.75rem 1rem; color: #666; text-decoration: none; border-bottom: 2px solid transparent; margin-bottom: -1px; }
      .tabs a[aria-current="page"] { color: #222; border-bottom-color: #222; font-weight: 600; }
      .fields { display: grid; grid-template-columns: 8rem 1fr; gap: 0.6rem 1rem; align-items: baseline; border: 0; padding: 0; margin: 1rem 0; }
      .fields > label, .fields .group > label { color: #555; font-size: 0.9rem; }
      .fields input, .fields textarea, .fields select { font: inherit; padding: 0.4rem; width: 100%; box-sizing: border-box; }
      .fields .group { grid-column: 1 / -1; display: grid; grid-template-columns: 7rem 1fr; gap: inherit; align-items: baseline; border: 1px solid #ddd; padding: 0.5rem 1rem 1rem; margin: 0; }
      .fields .wide { grid-column: 1 / -1; }
      .fields .code { font: 0.85rem/1.4 ui-monospace, monospace; }
      .fields .label { color: #555; font-size: 0.9rem; }
      .fields .choices { display: flex; flex-wrap: wrap; gap: 0.25rem 1rem; }
      .fields .choices input { width: auto; margin-right: 0.3rem; }
      .fields .model { display: flex; gap: 0.5rem; }
      .past { border: 1px solid #ddd; border-radius: 4px; padding: 0.75rem 1rem; margin: 0.75rem 0; }
      .past .meta { display: block; }
      .past .summary { margin-top: 0.5rem; white-space: pre-wrap; }
      /* The conversation: a box of its own, the session's controls at its top, the transcript
         scrolling between and the box to type in at its bottom. min(60svh, 36rem): 36rem holds the
         controls, the box to type in and about seventeen transcript lines, the last few exchanges;
         60% of the screen leaves the context in sight below it on a phone, measured with the
         browser's toolbar shown, so the box doesn't resize as the toolbar comes and goes. */
      .conversation { display: flex; flex-direction: column; height: min(60svh, 36rem); box-sizing: border-box; border: 1px solid #ddd; border-radius: 4px; padding: 0 1rem; margin-bottom: 1.5rem; }
      .conversation-top { border-bottom: 1px solid #eee; }
      .conversation-top:empty { display: none; }
      /* Up to 40% of the box, so a note or two leave the transcript room on a phone held sideways. */
      .conversation-top { max-height: 40%; overflow-y: auto; }
      .conversation-top > p { margin: 0.5rem 0; }
      .conversation .controls { align-items: center; margin: 0.75rem 0; }
      .conversation .controls .meta { flex: 1; }
      .transcript { flex: 1; min-height: 0; position: relative; }
      .transcript .lines { height: 100%; overflow-y: auto; }
      .latest { position: absolute; bottom: 0.5rem; left: 50%; transform: translateX(-50%); font-size: 0.85rem; padding: 0.25rem 0.75rem; background: #fff; border: 1px solid #ccc; border-radius: 1rem; box-shadow: 0 1px 4px rgb(0 0 0 / 15%); }
      .conversation > form.row { border-top: 1px solid #eee; margin: 0; padding: 0.75rem 0; }
      /* From 60rem, the context and the conversation sit side by side under the header, the context
         scrolling on its own: at 60rem the context keeps about 22rem, room for the form, and the
         conversation about 34rem, a line of about 70 characters. Narrower, as on a phone, the
         conversation comes first and the context follows. The page widens to 90rem, two of the
         single column's 44rem and the gap; the Agents tab keeps one. */
      @media (min-width: 60rem) {
        body { max-width: 90rem; margin: 0 auto; }
        main { display: flex; flex-direction: column; height: 100dvh; padding-top: 2rem; box-sizing: border-box; }
        main > div { flex: 1; min-height: 0; overflow-y: auto; }
        /* Two to three: the conversation is what is watched during a session, the context is read
           before and after it. */
        .columns { display: grid; grid-template-columns: 2fr 3fr; grid-template-rows: minmax(0, 1fr); gap: 2rem; height: 100%; }
        .context { grid-area: 1 / 1; overflow-y: auto; padding: 0 0.5rem 1rem 0.25rem; }
        .conversation { grid-area: 1 / 2; margin-top: 1rem; }
        .agents > * { max-width: 44rem; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/page/main.tsx"></script>
  </body>
</html>
